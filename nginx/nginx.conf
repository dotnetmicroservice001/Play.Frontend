server {

  listen 80;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }

  # config.js carries per-deploy environment values (API URLs) and is
  # regenerated on every release, so it must never be served stale —
  # without this, browsers apply heuristic caching and keep old API
  # URLs after a deploy until a hard refresh.
  location = /config.js {
    root   /usr/share/nginx/html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }

  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }

}